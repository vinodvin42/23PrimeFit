name: primefit_mobile
description: 23PrimeFit Flutter client — health, fitness, nutrition, coaching.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  dio: ^5.10.0
  google_fonts: ^8.2.0
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  fl_chart: ^1.2.0
  image_picker: ^1.2.3
  drift: ^2.34.2
