name: coach-web-ci
on:
  pull_request:
    paths:
      - 'apps/coach-web/**'
      - 'packages/ui-tokens/**'
      - '.github/workflows/coach-web-ci.yml'
  push:
    branches: [main, master]
    paths:
      - 'apps/coach-web/**'
      - 'packages/ui-tokens/**'

jobs:
  lint-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/coach-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/coach-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3001/api
