services:
  postgres:
    image: postgres:16-alpine
    container_name: primefit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: primefit
      POSTGRES_PASSWORD: primefit
      POSTGRES_DB: primefit
    ports:
      - "5433:5432"
    volumes:
      - primefit_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: primefit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  primefit_pg:
